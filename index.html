<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Rishu  ❤️</title>
    <style>
        body {
            background-color: #ffeef2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            position: relative;
        }

        h1 {
            color: #d63384;
            font-size: 24px;
        }

        .btn-group {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        #yes-btn {
            background-color: #ff4d6d;
            color: white;
        }

        #no-btn {
            background-color: #6c757d;
            color: white;
            position: absolute;
        }

        #success-msg {
            display: none;
        }

        img {
            width: 100%;
            border-radius: 15px;
            margin-top: 15px;
        }

        #music-container {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>Rishu, will you be my Valentine? ❤️</h1>
        <div class="btn-group">
            <button id="yes-btn" onclick="celebrate()">Yes</button>
            <button id="no-btn" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <div class="container" id="success-msg">
        <h1>Yay! See you soon! ❤️</h1>
        <img src="us.jpg" alt="Us">
        <p>I love you!</p>
        
        <div id="music-container">
            <iframe id="player" width="1" height="1" 
                src="https://www.youtube.com/embed/LV_wiOhO40Q?autoplay=0&enablejsapi=1" 
                frameborder="0">
            </iframe>
        </div>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('no-btn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('main-card').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            
            // This plays the "Dooran Dooran" video in the background
            const player = document.getElementById('player');
            player.src += "&autoplay=1";
        }
    </script>
</body>
</html>
