<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Rishu ❤️</title>
    <style>
        /* Apple-style smooth font and layout */
        body { 
            background: linear-gradient(135deg, #ffeef2 0%, #fff0f5 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
            touch-action: manipulation; /* Improves touch response */
        }

        .container { 
            text-align: center; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); /* iPhone "Frosted Glass" effect */
            padding: 40px; 
            border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            width: 85%;
            max-width: 350px; 
            position: relative; 
            z-index: 10; 
            transition: opacity 0.5s ease;
        }

        h1 { 
            color: #d63384; 
            font-size: 28px; 
            font-weight: 700; 
            margin-bottom: 30px; 
            line-height: 1.3;
        }

        .btn-group { 
            position: relative; 
            height: 60px; /* Space for buttons to move */
            margin-top: 20px;
        }

        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 600; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent; /* Removes gray tap box on iPhone */
        }

        #yes-btn { 
            background-color: #ff4d6d; 
            color: white; 
            position: absolute;
            left: 50%;
            transform: translateX(-150%); /* Start slightly left */
        }

        #no-btn { 
            background-color: #e9ecef; 
            color: #495057; 
            position: absolute;
            left: 50%;
            transform: translateX(50%); /* Start slightly right */
            transition: top 0.2s ease, left 0.2s ease, opacity 0.5s ease; 
        }

        #success-msg { display: none; }
        
        img { 
            width: 100%; 
            border-radius: 20px; 
            margin-top: 20px; 
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.3);
            border: 4px solid #fff;
        }

        /* Confetti Animation */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        #player-wrapper { position: absolute; visibility: hidden; }
    </style>
</head>
<body>

    <div id="player-wrapper"><div id="player"></div></div>

    <div class="container" id="main-card">
        <h1>Rishu,<br>will you be my Valentine? ❤️</h1>
        <div class="btn-group">
            <button id="yes-btn" onclick="celebrate()">Yes</button>
            <button id="no-btn">No</button> </div>
    </div>

    <div class="container" id="success-msg">
        <h1>Yay! ❤️</h1>
        <img src="us.jpg" alt="Us">
        <p style="color: #d63384; font-weight: 600; margin-top: 20px; font-size: 18px;">I love you! 🎶</p>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- MUSIC LOGIC ---
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '1', width: '1',
                videoId: '4F7wcgwpp_U', // Dooron Dooron
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 }, // playsinline is key for iOS
            });
        }

        // --- IMPOSSIBLE BUTTON LOGIC ---
        const noBtn = document.getElementById('no-btn');
        let attempts = 0;

        // Mobile "Jump" function
        function moveButton(e) {
            if (e) e.preventDefault(); // Stop her from even clicking
            
            attempts++;
            
            // "Ghost Mode": After 5 tries, button fades away
            if (attempts > 5) {
                noBtn.style.opacity = "0";
                setTimeout(() => noBtn.style.display = "none", 500);
                return;
            }

            // Calculate random position within the card/screen safely
            // We use fixed math to keep it near the "Yes" button but hard to hit
            const x = (Math.random() * 200) - 100; // Move left/right by 100px
            const y = (Math.random() * 200) - 100; // Move up/down by 100px
            
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Add both Touch and Mouse listeners for maximum coverage
        noBtn.addEventListener('touchstart', moveButton, {passive: false}); // iPhone trigger
        noBtn.addEventListener('mouseover', moveButton); // Desktop trigger
        noBtn.addEventListener('click', moveButton); // Fallback

        // --- CELEBRATION LOGIC ---
        function celebrate() {
            document.getElementById('main-card').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            
            // Play Music
            if (player && player.playVideo) {
                player.unMute();
                player.setVolume(100);
                player.playVideo();
            }

            // Launch Confetti
            createConfetti();
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDuration = Math.random() * 2 + 3 + 's';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
