<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Rishu ❤️</title>
    <style>
        :root { --main-pink: #ff4d6d; --bg-pink: #ffeef2; }
        body { 
            background: var(--bg-pink); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden; touch-action: none; 
        }
        .container { 
            text-align: center; background: white; padding: 40px; 
            border-radius: 30px; box-shadow: 0 15px 35px rgba(214, 51, 132, 0.2); 
            width: 85%; max-width: 320px; position: relative; z-index: 10;
        }
        h1 { color: #d63384; font-size: 26px; margin-bottom: 40px; line-height: 1.3; }
        #yes-btn { 
            background: var(--main-pink); color: white; padding: 15px 40px; 
            border: none; border-radius: 50px; font-weight: bold; font-size: 18px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }
        #no-btn { 
            background: #f8f9fa; color: #6c757d; padding: 12px 25px; 
            border: none; border-radius: 50px; position: absolute; 
            transition: all 0.15s ease-out; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #success-msg { display: none; }
        img { width: 100%; border-radius: 20px; margin-top: 20px; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* Falling Hearts */
        .heart {
            position: fixed; top: -10vh; font-size: 20px;
            animation: fall linear forwards; z-index: 1;
        }
        @keyframes fall {
            to { transform: translateY(110vh) translateX(20px) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="player"></div>

    <div class="container" id="main-card">
        <h1>Rishu,<br>will you be my Valentine? ❤️</h1>
        <button id="yes-btn" onclick="celebrate()">Yes</button>
        <button id="no-btn" onpointerdown="moveBtn(event)" onmouseover="moveBtn(event)">No</button>
    </div>

    <div class="container" id="success-msg">
        <h1>Yay! ❤️</h1>
        <img src="us.jpg" alt="Us">
        <p style="color: #d63384; font-weight: bold; margin-top: 20px; font-size: 18px;">I love you! 🎶</p>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0', width: '0', videoId: '4F7wcgwpp_U',
                playerVars: { 'autoplay': 1, 'controls': 0, 'playsinline': 1, 'mute': 1 },
                events: { 'onReady': (e) => e.target.playVideo() }
            });
        }

        // Logic for the "Impossible" button
        function moveBtn(e) {
            e.preventDefault();
            const btn = document.getElementById('no-btn');
            // Move within safe viewport bounds
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 60);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('main-card').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            
            // Trigger Music (Unmute requires user interaction like this click)
            if (player) {
                player.unMute();
                player.setVolume(100);
                player.playVideo();
            }

            // Start Falling Hearts
            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    </script>
</body>
</html>
