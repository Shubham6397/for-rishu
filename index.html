<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Rishu ❤️</title>
    <style>
        body { background-color: #ffeef2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .container { text-align: center; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; position: relative; z-index: 10; }
        h1 { color: #d63384; font-size: 26px; line-height: 1.4; }
        .btn-group { margin-top: 30px; display: flex; justify-content: center; gap: 20px; }
        button { padding: 12px 25px; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        #yes-btn { background-color: #ff4d6d; color: white; }
        #no-btn { background-color: #6c757d; color: white; position: absolute; }
        #success-msg { display: none; }
        img { width: 100%; border-radius: 15px; margin-top: 15px; border: 3px solid #ff4d6d; }
        #player-wrapper { position: absolute; top: -1000px; left: -1000px; visibility: hidden; }
    </style>
</head>
<body>

    <div id="player-wrapper">
        <div id="player"></div>
    </div>

    <div class="container" id="main-card">
        <h1>Rishu, will you be my Valentine? ❤️</h1>
        <div class="btn-group">
            <button id="yes-btn" onclick="celebrate()">Yes</button>
            <button id="no-btn" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <div class="container" id="success-msg">
        <h1>Yay! See you soon! ❤️</h1>
        <img src="us.jpg" alt="Our Picture">
        <p style="color: #d63384; font-weight: bold; margin-top: 15px;">I love you! 🎶</p>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '1',
                width: '1',
                videoId: '4F7wcgwpp_U', 
                playerVars: { 'autoplay': 0, 'controls': 0, 'modestbranding': 1, 'loop': 1 },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            console.log("Music engine ready!");
        }

        function moveButton() {
            const btn = document.getElementById('no-btn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 50);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function celebrate() {
            document.getElementById('main-card').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            
            if (player && player.playVideo) {
                player.unMute();
                player.setVolume(100);
                player.playVideo();
            }
        }
    </script>
</body>
</html>
